name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

defaults:
  run:
    # The actual Gradle project (settings.gradle.kts, app/, etc.) lives in
    # the "sniveil" subfolder of this repo, not at the repo root — so every
    # plain shell step below runs from inside it.
    working-directory: sniveil

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android is no longer reliable (it tries to
      # install the long-removed legacy "tools" package and fails), so the
      # SDK command-line tools are installed by hand here instead.
      - name: Install Android SDK command-line tools
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip

      - name: Install platform, build-tools and platform-tools (API 35)
        working-directory: ${{ github.workspace }}
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: sniveil

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sniveil-debug-apk
          path: sniveil/app/build/outputs/apk/debug/app-debug.apk
